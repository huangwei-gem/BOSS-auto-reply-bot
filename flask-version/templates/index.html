<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS Auto-Reply Bot</title>
    <style>
        /* ==================== Reset & Base ==================== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #2563eb;
            --accent-soft: rgb(37 99 235 / .08);
            --accent-border: rgb(37 99 235 / .2);
            --surface: rgb(255 255 255 / .62);
            --surface-elevated: rgb(255 255 255 / .78);
            --border: rgb(0 0 0 / .06);
            --border-strong: rgb(0 0 0 / .1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-sm: 0 1px 3px rgb(0 0 0 / .04);
            --shadow-md: 0 4px 16px rgb(0 0 0 / .06);
            --shadow-lg: 0 12px 40px rgb(0 0 0 / .08);
            --blur: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            color: var(--text-primary);
            min-height: 100dvh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ==================== Background Decoration ==================== */
        .bg-decoration {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
        }

        .bg-blob-1 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #93c5fd, #c4b5fd);
            top: -120px; left: -100px;
        }

        .bg-blob-2 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #a7f3d0, #93c5fd);
            bottom: -80px; right: -80px;
        }

        .bg-blob-3 {
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #fde68a, #fca5a5);
            top: 50%; right: 20%;
            opacity: .18;
        }

        /* ==================== Glass Panel ==================== */
        .glass {
            position: relative;
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgb(255 255 255 / .35), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glass > * { position: relative; z-index: 1; }

        @media (prefers-reduced-transparency: reduce) {
            .glass {
                background: rgb(255 255 255 / .96);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }

        /* ==================== Layout ==================== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* ==================== Header ==================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 4px 14px rgb(37 99 235 / .3);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all .25s ease;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-running {
            background: rgb(16 185 129 / .1);
            color: var(--success);
            border-color: rgb(16 185 129 / .2);
        }

        .status-running .status-dot {
            background: var(--success);
            box-shadow: 0 0 0 3px rgb(16 185 129 / .2);
            animation: pulse 2s infinite;
        }

        .status-stopped {
            background: rgb(239 68 68 / .08);
            color: var(--danger);
            border-color: rgb(239 68 68 / .15);
        }

        .status-stopped .status-dot {
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgb(16 185 129 / .2); }
            50% { box-shadow: 0 0 0 6px rgb(16 185 129 / .08); }
        }

        /* ==================== Stats Grid ==================== */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 22px 24px;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 14px;
        }

        .stat-icon-blue { background: rgb(37 99 235 / .1); }
        .stat-icon-green { background: rgb(16 185 129 / .1); }
        .stat-icon-amber { background: rgb(245 158 11 / .1); }
        .stat-icon-purple { background: rgb(124 58 237 / .1); }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ==================== Controls ==================== */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 20px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            background: var(--surface-elevated);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-border);
        }

        .btn:active:not(:disabled) {
            transform: scale(.97);
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 8px rgb(37 99 235 / .25);
        }

        .btn-primary:hover:not(:disabled) {
            background: #1d4ed8;
            box-shadow: 0 4px 16px rgb(37 99 235 / .35);
        }

        .btn-danger {
            color: var(--danger);
            border-color: rgb(239 68 68 / .2);
            background: rgb(239 68 68 / .05);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgb(239 68 68 / .1);
            border-color: rgb(239 68 68 / .3);
        }

        /* ==================== Main Grid ==================== */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .panel-header-action {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: background .15s;
        }

        .panel-header-action:hover {
            background: var(--accent-soft);
        }

        .panel-body {
            padding: 16px 22px;
            overflow-y: auto;
            flex: 1;
            max-height: 420px;
        }

        .panel-body::-webkit-scrollbar {
            width: 5px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: rgb(0 0 0 / .1);
            border-radius: 999px;
        }

        /* ==================== Log Entries ==================== */
        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .log-entry:last-child { border-bottom: none; }

        .log-time {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            font-size: 12px;
            padding-top: 1px;
        }

        .log-level {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .log-level-INFO {
            background: rgb(37 99 235 / .1);
            color: var(--accent);
        }

        .log-level-ERROR {
            background: rgb(239 68 68 / .1);
            color: var(--danger);
        }

        .log-level-WARNING {
            background: rgb(245 158 11 / .1);
            color: var(--warning);
        }

        .log-msg {
            color: var(--text-secondary);
            word-break: break-all;
            line-height: 1.4;
        }

        /* ==================== Unread Items ==================== */
        .unread-item {
            padding: 14px 16px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: transform .15s, box-shadow .15s;
        }

        .unread-item:hover {
            transform: translateX(2px);
            box-shadow: var(--shadow-sm);
        }

        .unread-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .unread-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px; height: 20px;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            padding: 0 6px;
        }

        .unread-preview {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* ==================== Config & Rules ==================== */
        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .config-item:last-child { border-bottom: none; }

        .config-key {
            font-size: 13px;
            color: var(--text-muted);
        }

        .config-val {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .rule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-xs);
            margin-bottom: 6px;
            font-size: 13px;
        }

        .rule-keyword {
            font-weight: 600;
            color: var(--accent);
        }

        .rule-action {
            color: var(--text-secondary);
            font-size: 12px;
            max-width: 60%;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ==================== Empty State ==================== */
        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 14px;
        }

        /* ==================== Modal ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgb(0 0 0 / .3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 90%;
            max-width: 860px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn .25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px; height: 32px;
            border: none;
            background: var(--accent-soft);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .modal-close:hover {
            background: rgb(239 68 68 / .1);
            color: var(--danger);
        }

        .modal-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            background: rgb(255 255 255 / .3);
        }

        .modal-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xs);
            background: var(--surface-elevated);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .modal-select:focus {
            border-color: var(--accent);
        }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-all;
            background: rgb(255 255 255 / .3);
        }

        /* ==================== Browser Selector ==================== */
        .browser-selector {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .browser-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .browser-select {
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            padding-right: 4px;
        }

        /* ==================== Responsive ==================== */
        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .main { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .container { padding: 16px 12px; }
            .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 16px; }
            .stat-value { font-size: 24px; }
            .header { padding: 16px 20px; }
            .header-title { font-size: 17px; }
            .controls { gap: 8px; }
            .btn { padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-decoration">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header glass">
            <div class="header-left">
                <div class="logo-icon">B</div>
                <div>
                    <div class="header-title">BOSS 自动回复机器人</div>
                    <div class="header-subtitle">自动化聊天回复系统</div>
                </div>
            </div>
            <span id="statusBadge" class="status-badge status-stopped">
                <span class="status-dot"></span>
                <span id="statusText">已停止</span>
            </span>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card glass">
                <div class="stat-icon stat-icon-blue">💬</div>
                <div class="stat-value" id="statReplies">0</div>
                <div class="stat-label">已回复消息</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon stat-icon-green">📄</div>
                <div class="stat-value" id="statResumes">0</div>
                <div class="stat-label">已发简历</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon stat-icon-amber">🕐</div>
                <div class="stat-value" id="statLastCheck">--:--</div>
                <div class="stat-label">上次检查</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon stat-icon-purple">⚡</div>
                <div class="stat-value" id="statCurrent">--</div>
                <div class="stat-label">当前处理</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="btnStart" onclick="startBot()">▶ 启动</button>
            <button class="btn btn-danger" id="btnStop" onclick="stopBot()" disabled>⏹ 停止</button>
            <button class="btn" onclick="refreshUnread()">🔄 刷新未读</button>
            <button class="btn" onclick="showLogFiles()">📁 日志文件</button>
            <div style="flex:1"></div>
            <div class="browser-selector" id="browserSelector">
                <span class="browser-label">🌐 浏览器</span>
                <select class="browser-select" id="browserSelect" onchange="selectBrowser()">
                    <option value="">检测中...</option>
                </select>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <!-- Left Column -->
            <div>
                <div class="panel glass" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span>📋 未读消息</span>
                        <span id="unreadTotal" style="color:var(--text-muted);font-size:13px;">0</span>
                    </div>
                    <div class="panel-body" id="unreadList">
                        <div class="empty">点击"刷新未读"查看消息</div>
                    </div>
                </div>

                <div class="panel glass">
                    <div class="panel-header">
                        <span>📜 操作日志</span>
                        <button class="panel-header-action" onclick="showLogFiles()">查看文件 →</button>
                    </div>
                    <div class="panel-body" id="logList">
                        <div class="empty">启动机器人后查看日志</div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <div class="panel glass" style="margin-bottom:20px;">
                    <div class="panel-header">⚙️ 配置信息</div>
                    <div class="panel-body" id="configPanel">
                        <div class="config-item">
                            <span class="config-key">检查间隔</span>
                            <span class="config-val" id="cfgInterval">--</span>
                        </div>
                        <div class="config-item">
                            <span class="config-key">每小时上限</span>
                            <span class="config-val" id="cfgMax">--</span>
                        </div>
                        <div class="config-item">
                            <span class="config-key">规则数量</span>
                            <span class="config-val" id="cfgRules">--</span>
                        </div>
                    </div>
                </div>

                <div class="panel glass">
                    <div class="panel-header">🎯 回复规则</div>
                    <div class="panel-body" id="rulesPanel">
                        <div class="empty">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Log File Modal -->
    <div class="modal-overlay" id="logModal" onclick="if(event.target===this) closeLogModal()">
        <div class="modal glass">
            <div class="modal-header">
                <span class="modal-title">📁 日志文件</span>
                <button class="modal-close" onclick="closeLogModal()">✕</button>
            </div>
            <div class="modal-toolbar">
                <select class="modal-select" id="logFileSelect" onchange="loadLogFile()">
                    <option value="">选择日志文件...</option>
                </select>
                <button class="btn" onclick="refreshLogFiles()" style="flex-shrink:0;">刷新</button>
            </div>
            <div class="modal-content" id="logFileContent">选择文件查看内容</div>
        </div>
    </div>

    <script>
        // ==================== Helpers ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Status ====================
        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const json = await res.json();
                const data = json.data;

                const badge = document.getElementById('statusBadge');
                const statusText = document.getElementById('statusText');

                if (data.running) {
                    badge.className = 'status-badge status-running';
                    statusText.textContent = '运行中';
                    document.getElementById('btnStart').disabled = true;
                    document.getElementById('btnStop').disabled = false;
                } else {
                    badge.className = 'status-badge status-stopped';
                    statusText.textContent = '已停止';
                    document.getElementById('btnStart').disabled = false;
                    document.getElementById('btnStop').disabled = true;
                }

                document.getElementById('statReplies').textContent = data.total_replies;
                document.getElementById('statResumes').textContent = data.total_resumes;
                document.getElementById('statLastCheck').textContent = data.last_check || '--:--';
                document.getElementById('statCurrent').textContent = data.current_chat || '--';
            } catch (e) {
                console.error('Status update failed:', e);
            }
        }

        // ==================== Logs ====================
        async function updateLogs() {
            try {
                const res = await fetch('/api/logs?limit=50');
                const json = await res.json();
                const logs = json.data;

                if (logs.length === 0) return;

                const html = logs.map(log => `
                    <div class="log-entry">
                        <span class="log-time">${log.time}</span>
                        <span class="log-level log-level-${log.level}">${log.level}</span>
                        <span class="log-msg">${escapeHtml(log.message)}</span>
                    </div>
                `).join('');

                document.getElementById('logList').innerHTML = html;
            } catch (e) {
                console.error('Log update failed:', e);
            }
        }

        // ==================== Unread ====================
        async function refreshUnread() {
            const container = document.getElementById('unreadList');
            container.innerHTML = '<div class="empty">加载中...</div>';

            try {
                const res = await fetch('/api/unread');
                const json = await res.json();

                if (json.success) {
                    const items = json.data;
                    document.getElementById('unreadTotal').textContent = items.length;

                    if (items.length > 0) {
                        container.innerHTML = items.map(item => `
                            <div class="unread-item">
                                <div class="unread-name">
                                    ${escapeHtml(item.name)}
                                    <span class="unread-count">${item.count}</span>
                                </div>
                                <div class="unread-preview">${escapeHtml(item.preview)}</div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = '<div class="empty">暂无未读消息</div>';
                    }
                } else {
                    container.innerHTML = `<div class="empty">错误: ${json.message}</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="empty">请求失败: ${e}</div>`            }
        }

        // ==================== Config ====================
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const json = await res.json();
                const data = json.data;

                document.getElementById('cfgInterval').textContent = data.check_interval + ' 秒';
                document.getElementById('cfgMax').textContent = data.max_replies_per_hour;
                document.getElementById('cfgRules').textContent = data.rules_count;

                const rulesHtml = Object.entries(data.rules).map(([k, v]) => `
                    <div class="rule-item">
                        <span class="rule-keyword">${escapeHtml(k)}</span>
                        <span class="rule-action">${escapeHtml(v)}</span>
                    </div>
                `).join('');
                document.getElementById('rulesPanel').innerHTML = rulesHtml || '<div class="empty">无规则</div>';
            } catch (e) {
                console.error('Config load failed:', e);
            }
        }

        // ==================== Bot Controls ====================
        async function startBot() {
            const res = await fetch('/api/start', { method: 'POST' });
            const json = await res.json();
            alert(json.message);
            updateStatus();
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            const json = await res.json();
            alert(json.message);
            updateStatus();
        }

        // ==================== Log Files Modal ====================
        function showLogFiles() {
            document.getElementById('logModal').classList.add('active');
            refreshLogFiles();
        }

        function closeLogModal() {
            document.getElementById('logModal').classList.remove('active');
        }

        async function refreshLogFiles() {
            try {
                const res = await fetch('/api/logfiles');
                const json = await res.json();
                const select = document.getElementById('logFileSelect');
                select.innerHTML = '<option value="">选择日志文件...</option>';
                json.data.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    const sizeKB = (f.size / 1024).toFixed(1);
                    opt.textContent = `${f.name} (${sizeKB} KB) - ${f.modified}`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Failed to load log files:', e);
            }
        }

        async function loadLogFile() {
            const filename = document.getElementById('logFileSelect').value;
            if (!filename) return;
            try {
                const res = await fetch('/api/logfile/' + encodeURIComponent(filename));
                const json = await res.json();
                document.getElementById('logFileContent').textContent = json.data || json.message || '空文件';
            } catch (e) {
                document.getElementById('logFileContent').textContent = '加载失败: ' + e;
            }
        }

        // ==================== Browser Selector ====================
        const BROWSER_NAMES = {
            chrome: "Google Chrome",
            edge: "Microsoft Edge",
            chromium: "Chromium"
        };

        async function loadBrowserSelector() {
            try {
                const res = await fetch('/api/browser/detect');
                const json = await res.json();
                if (!json.success) return;

                const { available, selected, default: defaultBrowser } = json.data;
                const select = document.getElementById('browserSelect');

                select.innerHTML = '';
                const browsers = Object.entries(available);

                if (browsers.length === 0) {
                    select.innerHTML = '<option value="">未检测到浏览器</option>';
                    return;
                }

                for (const [key, path] of browsers) {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = BROWSER_NAMES[key] || key;
                    if (key === (selected || defaultBrowser)) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                }
            } catch (e) {
                console.error('Browser detection failed:', e);
            }
        }

        async function selectBrowser() {
            const name = document.getElementById('browserSelect').value;
            if (!name) return;
            try {
                const res = await fetch('/api/browser/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ browser: name })
                });
                const json = await res.json();
                // 轻提示，不用 alert
                const selector = document.getElementById('browserSelector');
                selector.style.borderColor = 'var(--success)';
                setTimeout(() => selector.style.borderColor = '', 800);
            } catch (e) {
                console.error('Browser selection failed:', e);
            }
        }

        // ==================== Init ====================
        setInterval(updateStatus, 2000);
        setInterval(updateLogs, 1000);

        updateStatus();
        updateLogs();
        loadConfig();
        loadBrowserSelector();
    </script>
</body>
</html>

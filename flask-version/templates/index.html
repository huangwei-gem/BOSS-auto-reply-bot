<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS 自动回复机器人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid #333; margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; color: #00d4ff; }
        .status-badge {
            padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold;
        }
        .status-running { background: #00c853; color: #000; }
        .status-stopped { background: #ff5252; color: #fff; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card {
            background: #16213e; border-radius: 12px; padding: 20px; text-align: center;
            border: 1px solid #333;
        }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #00d4ff; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 5px; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-start { background: #00c853; color: #000; }
        .btn-start:hover { background: #00e676; }
        .btn-stop { background: #ff5252; color: #fff; }
        .btn-stop:hover { background: #ff1744; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Main content */
        .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .panel {
            background: #16213e; border-radius: 12px; border: 1px solid #333;
            overflow: hidden;
        }
        .panel-header {
            padding: 15px 20px; background: #0f3460; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-body { padding: 15px; max-height: 500px; overflow-y: auto; }

        /* Logs */
        .log-entry {
            padding: 6px 0; border-bottom: 1px solid #1a1a2e; font-size: 13px;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .log-time { color: #666; margin-right: 8px; }
        .log-level { display: inline-block; width: 50px; font-weight: bold; }
        .log-level-INFO { color: #00d4ff; }
        .log-level-ERROR { color: #ff5252; }
        .log-level-WARNING { color: #ffab00; }
        .log-msg { color: #ccc; }

        /* Unread list */
        .unread-item {
            padding: 12px; background: #1a1a2e; border-radius: 8px;
            margin-bottom: 10px; border-left: 3px solid #00d4ff;
        }
        .unread-name { font-weight: bold; color: #00d4ff; margin-bottom: 5px; }
        .unread-preview { font-size: 13px; color: #999; line-height: 1.4; }
        .unread-count {
            display: inline-block; background: #ff5252; color: #fff;
            padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 8px;
        }
        .empty { text-align: center; color: #666; padding: 40px; }

        /* Config */
        .config-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .config-key { color: #888; }
        .config-val { color: #00d4ff; font-weight: bold; }

        /* Rules */
        .rule-item {
            display: flex; justify-content: space-between; padding: 8px 12px;
            background: #1a1a2e; border-radius: 6px; margin-bottom: 6px; font-size: 13px;
        }
        .rule-keyword { color: #ffab00; font-weight: bold; }
        .rule-action { color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 BOSS 自动回复机器人</h1>
            <span id="statusBadge" class="status-badge status-stopped">已停止</span>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="value" id="statReplies">0</div>
                <div class="label">已回复消息</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statResumes">0</div>
                <div class="label">已发简历</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statLastCheck">--:--</div>
                <div class="label">上次检查</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statCurrent">--</div>
                <div class="label">当前处理</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-start" id="btnStart" onclick="startBot()">▶ 启动机器人</button>
            <button class="btn btn-stop" id="btnStop" onclick="stopBot()" disabled>⏹ 停止</button>
            <button class="btn" style="background:#333; color:#fff;" onclick="refreshUnread()">🔄 刷新未读</button>
            <button class="btn" style="background:#7c4dff; color:#fff;" onclick="runTest()">🧪 运行测试</button>
            <button class="btn" style="background:#ff6d00; color:#fff;" onclick="showLogFiles()">📁 日志文件</button>
        </div>

        <!-- Main -->
        <div class="main">
            <!-- Left: Logs + Unread -->
            <div>
                <div class="panel" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span>📋 未读消息</span>
                        <span id="unreadTotal" style="color:#ff5252;">0</span>
                    </div>
                    <div class="panel-body" id="unreadList">
                        <div class="empty">点击"刷新未读"查看</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span>📜 操作日志</span>
                        <button style="background:none;border:none;color:#00d4ff;cursor:pointer;font-size:12px;" onclick="showLogFiles()">查看文件 →</button>
                    </div>
                    <div class="panel-body" id="logList">
                        <div class="empty">启动机器人后查看日志</div>
                    </div>
                </div>
            </div>

            <!-- Right: Config + Rules -->
            <div>
                <div class="panel" style="margin-bottom:20px;">
                    <div class="panel-header">⚙️ 配置信息</div>
                    <div class="panel-body" id="configPanel">
                        <div class="config-item">
                            <span class="config-key">检查间隔</span>
                            <span class="config-val" id="cfgInterval">--</span>
                        </div>
                        <div class="config-item">
                            <span class="config-key">每小时上限</span>
                            <span class="config-val" id="cfgMax">--</span>
                        </div>
                        <div class="config-item">
                            <span class="config-key">规则数量</span>
                            <span class="config-val" id="cfgRules">--</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">🎯 回复规则</div>
                    <div class="panel-body" id="rulesPanel">
                        <div class="empty">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log File Viewer Modal -->
        <div id="logModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;" onclick="if(event.target===this) closeLogModal()">
            <div style="background:#16213e;margin:30px auto;width:90%;max-width:900px;height:85vh;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;">
                <div style="padding:15px 20px;background:#0f3460;display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-weight:bold;">📁 日志文件</span>
                    <button onclick="closeLogModal()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
                </div>
                <div style="padding:10px 20px;background:#1a1a2e;display:flex;gap:10px;align-items:center;">
                    <select id="logFileSelect" onchange="loadLogFile()" style="background:#0f3460;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:6px;flex:1;">
                        <option value="">选择日志文件...</option>
                    </select>
                    <button onclick="refreshLogFiles()" style="background:#333;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">刷新</button>
                </div>
                <div id="logFileContent" style="flex:1;overflow-y:auto;padding:15px;font-family:Consolas,Monaco,monospace;font-size:12px;color:#ccc;white-space:pre-wrap;background:#0a0a1a;">
                </div>
            </div>
        </div>
    </div>

    <script>
        // 状态更新
        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const json = await res.json();
                const data = json.data;

                // 状态徽章
                const badge = document.getElementById('statusBadge');
                if (data.running) {
                    badge.textContent = '运行中';
                    badge.className = 'status-badge status-running';
                    document.getElementById('btnStart').disabled = true;
                    document.getElementById('btnStop').disabled = false;
                } else {
                    badge.textContent = '已停止';
                    badge.className = 'status-badge status-stopped';
                    document.getElementById('btnStart').disabled = false;
                    document.getElementById('btnStop').disabled = true;
                }

                // 统计
                document.getElementById('statReplies').textContent = data.total_replies;
                document.getElementById('statResumes').textContent = data.total_resumes;
                document.getElementById('statLastCheck').textContent = data.last_check || '--:--';
                document.getElementById('statCurrent').textContent = data.current_chat || '--';
            } catch (e) {
                console.error('更新状态失败:', e);
            }
        }

        // 日志更新
        async function updateLogs() {
            try {
                const res = await fetch('/api/logs?limit=50');
                const json = await res.json();
                const logs = json.data;

                const html = logs.map(log => `
                    <div class="log-entry">
                        <span class="log-time">${log.time}</span>
                        <span class="log-level log-level-${log.level}">${log.level}</span>
                        <span class="log-msg">${escapeHtml(log.message)}</span>
                    </div>
                `).join('');

                document.getElementById('logList').innerHTML = html || '<div class="empty">暂无日志</div>';
            } catch (e) {
                console.error('更新日志失败:', e);
            }
        }

        // 刷新未读
        async function refreshUnread() {
            try {
                const res = await fetch('/api/unread');
                const json = await res.json();

                if (json.success) {
                    const items = json.data;
                    document.getElementById('unreadTotal').textContent = items.length;

                    if (items.length > 0) {
                        const html = items.map(item => `
                            <div class="unread-item">
                                <div class="unread-name">
                                    ${escapeHtml(item.name)}
                                    <span class="unread-count">${item.count}</span>
                                </div>
                                <div class="unread-preview">${escapeHtml(item.preview)}</div>
                            </div>
                        `).join('');
                        document.getElementById('unreadList').innerHTML = html;
                    } else {
                        document.getElementById('unreadList').innerHTML = '<div class="empty">暂无未读消息</div>';
                    }
                } else {
                    document.getElementById('unreadList').innerHTML = `<div class="empty">错误: ${json.message}</div>`;
                }
            } catch (e) {
                document.getElementById('unreadList').innerHTML = `<div class="empty">请求失败: ${e}</div>`;
            }
        }

        // 加载配置
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const json = await res.json();
                const data = json.data;

                document.getElementById('cfgInterval').textContent = data.check_interval + '秒';
                document.getElementById('cfgMax').textContent = data.max_replies_per_hour + '条';
                document.getElementById('cfgRules').textContent = data.rules_count + '条';

                // 规则列表
                const rulesHtml = Object.entries(data.rules).map(([k, v]) => `
                    <div class="rule-item">
                        <span class="rule-keyword">${escapeHtml(k)}</span>
                        <span class="rule-action">${escapeHtml(v)}</span>
                    </div>
                `).join('');
                document.getElementById('rulesPanel').innerHTML = rulesHtml || '<div class="empty">无规则</div>';
            } catch (e) {
                console.error('加载配置失败:', e);
            }
        }

        // 启动/停止
        async function startBot() {
            const res = await fetch('/api/start', { method: 'POST' });
            const json = await res.json();
            alert(json.message);
            updateStatus();
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            const json = await res.json();
            alert(json.message);
            updateStatus();
        }

        // 运行浏览器测试
        async function runTest() {
            if (!confirm('运行完整浏览器测试？需要约30秒。')) return;
            alert('测试已启动，请稍候...');
            try {
                const res = await fetch('/api/test', { method: 'POST' });
                const json = await res.json();
                if (json.success) {
                    alert('✅ 测试全部通过！\n\n返回码: ' + json.returncode);
                } else {
                    alert('❌ 测试失败:\n' + (json.message || json.stderr || '未知错误'));
                }
            } catch (e) {
                alert('测试请求失败: ' + e);
            }
        }

        // 日志文件查看
        function showLogFiles() {
            document.getElementById('logModal').style.display = 'block';
            refreshLogFiles();
        }

        function closeLogModal() {
            document.getElementById('logModal').style.display = 'none';
        }

        async function refreshLogFiles() {
            try {
                const res = await fetch('/api/logfiles');
                const json = await res.json();
                const select = document.getElementById('logFileSelect');
                select.innerHTML = '<option value="">选择日志文件...</option>';
                json.data.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    const sizeKB = (f.size / 1024).toFixed(1);
                    opt.textContent = `${f.name} (${sizeKB} KB) - ${f.modified}`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('加载日志文件列表失败:', e);
            }
        }

        async function loadLogFile() {
            const filename = document.getElementById('logFileSelect').value;
            if (!filename) return;
            try {
                const res = await fetch('/api/logfile/' + encodeURIComponent(filename));
                const json = await res.json();
                document.getElementById('logFileContent').textContent = json.data || json.message || '空文件';
            } catch (e) {
                document.getElementById('logFileContent').textContent = '加载失败: ' + e;
            }
        }

        // 工具
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 定时刷新
        setInterval(updateStatus, 2000);
        setInterval(updateLogs, 1000);

        // 初始化
        updateStatus();
        updateLogs();
        loadConfig();
    </script>
</body>
</html>

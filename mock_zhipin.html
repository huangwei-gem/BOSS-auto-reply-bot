<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mock BOSS 直聘聊天页 - 端到端测试</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; display: flex; height: 100vh; }
  #chat-list { width: 280px; border-right: 1px solid #e5e5e5; overflow-y: auto; background: #f7f8fa; }
  .friend-content { display: flex; padding: 14px 12px; cursor: pointer; border-bottom: 1px solid #eee; position: relative; }
  .friend-content:hover, .friend-content.active { background: #e8f3fc; }
  .figure { position: relative; width: 40px; height: 40px; margin-right: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 4px; background: #5b8ff9; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .notice-badge { position: absolute; top: -6px; right: -8px; background: #ff4d4f; color: #fff; border-radius: 8px; font-size: 11px; padding: 0 5px; min-width: 14px; text-align: center; display: none; }
  .notice-badge.show { display: block; }
  .title-box .name-box .name-text { font-weight: 600; font-size: 14px; color: #222; }
  .gray.last-msg { margin-top: 4px; }
  .last-msg-text { color: #999; font-size: 12px; }
  #chat-panel { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 12px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .top-info-content .name-text { font-size: 16px; font-weight: 600; }
  .chat-position-content .position-content { font-size: 13px; color: #00a6a7; }
  #message-list { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
  .message-item { margin-bottom: 14px; }
  .message-item.item-friend { text-align: left; }
  .message-item:not(.item-friend) { text-align: right; }
  .item-time .time { font-size: 11px; color: #bbb; display: block; margin-bottom: 4px; }
  .text-content { display: inline-block; background: #f0f0f0; padding: 8px 12px; border-radius: 6px; max-width: 70%; font-size: 14px; }
  .message-item:not(.item-friend) .text-content { background: #95ec69; }
  #input-area { border-top: 1px solid #eee; padding: 12px 20px; }
  #toolbar { margin-bottom: 8px; }
  .toolbar-btn { display: inline-block; padding: 4px 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; margin-right: 8px; }
  .toolbar-btn:hover { border-color: #00a6a7; color: #00a6a7; }
  #chat-input { min-height: 44px; border: 1px solid #ddd; border-radius: 4px; padding: 8px; font-size: 14px; outline: none; }
  #chat-input:focus { border-color: #00a6a7; }
  #send-row { text-align: right; margin-top: 8px; }
  .btn-v2 { padding: 6px 22px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .btn-v2.btn-sure-v2 { background: #00a6a7; color: #fff; }
  .btn-v2.btn-outline-v2 { background: #fff; color: #666; border: 1px solid #ddd; }
  .btn-v2.btn-sure-v2.disabled, .btn-v2.disabled { opacity: .4; cursor: not-allowed; }
  .btn-v2.btn-send { background: #00a6a7; color: #fff; }
  /* 确认弹层 — 模拟真实 BOSS v5543 结构 */
  .panel-resume.sentence-popover { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .panel-resume.sentence-popover.visible { display: flex; }
  .panel-resume .popover-content { background: #fff; border-radius: 8px; width: 360px; padding: 24px; text-align: center; }
  .panel-resume .popover-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .panel-resume .popover-actions { display: flex; justify-content: center; gap: 12px; }
  /* 上传引导弹层 */
  .upload-resume-dialog { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .upload-resume-dialog.visible { display: flex; }
  .upload-resume-dialog .dialog-container { background: #fff; border-radius: 8px; width: 420px; padding: 24px; text-align: center; }
  .upload-resume-dialog .dialog-container .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .upload-resume-dialog .dialog-container .upload-hint { font-size: 14px; color: #999; margin-bottom: 20px; }
</style>
</head>
<body>
  <div id="chat-list">
    <div class="friend-content" data-name="李经理" data-job="数据分析师">
      <div class="figure"><div class="avatar">李</div><span class="notice-badge show">1</span></div>
      <div class="title-box"><div class="name-box"><span class="name-text">李经理</span></div>
      <div class="gray last-msg"><span class="last-msg-text">方便发一下简历吗？</span></div></div>
    </div>
    <div class="friend-content" data-name="王HR" data-job="数据分析专员">
      <div class="figure"><div class="avatar">王</div><span class="notice-badge show">1</span></div>
      <div class="title-box"><div class="name-box"><span class="name-text">王HR</span></div>
      <div class="gray last-msg"><span class="last-msg-text">预算范围是多少呀？</span></div></div>
    </div>
    <div class="friend-content" data-name="赵总监" data-job="商业分析师">
      <div class="figure"><div class="avatar">赵</div><span class="notice-badge show">1</span></div>
      <div class="title-box"><div class="name-box"><span class="name-text">赵总监</span></div>
      <div class="gray last-msg"><span class="last-msg-text">明天下午方便来公司面试吗？</span></div></div>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-header">
      <div class="top-info-content"><span class="name-text">李经理</span></div>
      <div class="chat-position-content"><span class="position-content">数据分析师</span></div>
    </div>
    <ul id="message-list"></ul>
    <div id="input-area">
      <div id="toolbar">
        <button class="toolbar-btn">发简历</button>
      </div>
      <div id="chat-input" contenteditable="true"></div>
      <div id="send-row">
        <button class="btn-v2 btn-sure-v2 btn-send disabled">发送</button>
      </div>
    </div>
  </div>

  <div class="panel-resume sentence-popover">
    <div class="popover-content">
      <div class="popover-title">确定向 Boss 发送简历吗？</div>
      <div class="popover-actions">
        <button class="btn-v2 btn-outline-v2">取消</button>
        <button class="btn-v2 btn-sure-v2">确定</button>
      </div>
    </div>
  </div>

  <div class="upload-resume-dialog">
    <div class="dialog-container">
      <div class="upload-title">上传附件简历</div>
      <div class="upload-hint">拖拽文件到这里…上传附件简历</div>
    </div>
  </div>

<script>
  var chatData = {
    "李经理": {
      job: "数据分析师",
      messages: [
        { side: "friend", text: "您好，看了您的主页很感兴趣", time: "10:02" },
        { side: "friend", text: "方便发一下简历吗？", time: "10:02" }
      ]
    },
    "王HR": {
      job: "数据分析专员",
      messages: [
        { side: "friend", text: "您好，我们是XX科技的", time: "11:30" },
        { side: "friend", text: "你们这边给的预算范围是多少呀？", time: "11:31" }
      ]
    },
    "赵总监": {
      job: "商业分析师",
      messages: [
        { side: "friend", text: "你好，看过你的资料了，背景不错", time: "14:00" },
        { side: "friend", text: "明天下午方便来公司面试吗？", time: "14:01" }
      ]
    }
  };

  var currentChat = "李经理";

  function el(cls, text) {
    var li = document.createElement("li");
    li.className = cls;
    li.innerHTML =
      '<span class="item-time"><span class="time">' + nowStr() + '</span></span>' +
      '<span class="text-content"></span>';
    li.querySelector(".text-content").textContent = text;
    return li;
  }
  function nowStr() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function renderChat(name) {
    currentChat = name;
    var data = chatData[name];
    document.querySelector(".top-info-content .name-text").textContent = name;
    document.querySelector(".chat-position-content .position-content").textContent = data.job;
    var list = document.getElementById("message-list");
    list.innerHTML = "";
    data.messages.forEach(function(m) {
      var cls = "message-item" + (m.side === "friend" ? " item-friend" : "");
      list.appendChild(el(cls, m.text));
    });
    var item = document.querySelector('.friend-content[data-name="' + name + '"]');
    if (item) {
      var badge = item.querySelector(".notice-badge");
      badge.classList.remove("show");
      badge.textContent = "";
      item.classList.add("active");
      item.querySelector(".last-msg-text").textContent = "";
    }
    document.querySelectorAll(".friend-content").forEach(function(f) {
      if (f.dataset.name !== name) f.classList.remove("active");
    });
  }

  document.querySelectorAll(".friend-content").forEach(function(item) {
    item.addEventListener("click", function() {
      renderChat(item.dataset.name);
    });
  });

  var input = document.getElementById("chat-input");
  var sendBtn = document.querySelector(".btn-send");
  input.addEventListener("input", function() {
    if (input.textContent.trim()) sendBtn.classList.remove("disabled");
    else sendBtn.classList.add("disabled");
  });
  sendBtn.addEventListener("click", function() {
    if (sendBtn.classList.contains("disabled")) return;
    var text = input.textContent.trim();
    if (!text) return;
    var li = el("message-item", text);
    document.getElementById("message-list").appendChild(li);
    chatData[currentChat].messages.push({ side: "mine", text: text, time: nowStr() });
    input.textContent = "";
    sendBtn.classList.add("disabled");
    li.scrollIntoView();
  });

  var panel = document.querySelector(".panel-resume.sentence-popover");
  var sureBtn = panel.querySelector(".btn-sure-v2");
  var cancelBtn = panel.querySelector(".btn-outline-v2");
  document.querySelector(".toolbar-btn").addEventListener("click", function() {
    panel.classList.add("visible");
  });
  cancelBtn.addEventListener("click", function() {
    panel.classList.remove("visible");
  });
  sureBtn.addEventListener("click", function() {
    var text = "简历已发送";
    var li = el("message-item", text);
    document.getElementById("message-list").appendChild(li);
    chatData[currentChat].messages.push({ side: "mine", text: text, time: nowStr() });
    panel.classList.remove("visible");
    li.scrollIntoView();
  });
</script>
</body>
</html>
